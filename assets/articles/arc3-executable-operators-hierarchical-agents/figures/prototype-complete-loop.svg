  <text class="title" x="55" y="67">从一帧变化到一段可靠行动</text><text class="sub" x="55" y="102">主链只向前生长；三条反馈把错误重新暴露给更低层。</text><g filter="url(#shadow)"><rect x="55" y="145" width="230" height="96" rx="16" fill="#FFFDFC" stroke="#C7B9A4" stroke-width="2"/><rect x="55" y="145" width="9" height="96" rx="4" fill="#B38A43"/><text class="boxTitle" x="79" y="184">帧变化</text><text class="boxSub" x="79" y="214">x_t, a_t, x_(t+1)</text></g><g filter="url(#shadow)"><rect x="330" y="145" width="230" height="96" rx="16" fill="#FFFDFC" stroke="#C7B9A4" stroke-width="2"/><rect x="330" y="145" width="9" height="96" rx="4" fill="#B38A43"/><text class="boxTitle" x="354" y="184">对象／关系假设</text><text class="boxSub" x="354" y="214">竞争解析 ψⱼ</text></g><g filter="url(#shadow)"><rect x="605" y="145" width="230" height="96" rx="16" fill="#FFFDFC" stroke="#C7B9A4" stroke-width="2"/><rect x="605" y="145" width="9" height="96" rx="4" fill="#B38A43"/><text class="boxTitle" x="629" y="184">状态变换程序</text><text class="boxSub" x="629" y="214">可执行 DSL：qⱼ</text></g><g filter="url(#shadow)"><rect x="880" y="145" width="230" height="96" rx="16" fill="#FFFDFC" stroke="#C7B9A4" stroke-width="2"/><rect x="880" y="145" width="9" height="96" rx="4" fill="#B38A43"/><text class="boxTitle" x="904" y="184">模型选择</text><text class="boxSub" x="904" y="214">MDL／贝叶斯证据</text></g><g filter="url(#shadow)"><rect x="1155" y="145" width="230" height="96" rx="16" fill="#FFFDFC" stroke="#C7B9A4" stroke-width="2"/><rect x="1155" y="145" width="9" height="96" rx="4" fill="#B38A43"/><text class="boxTitle" x="1179" y="184">变量化</text><text class="boxSub" x="1179" y="214">anti-unification</text></g><g filter="url(#shadow)"><rect x="55" y="390" width="230" height="96" rx="16" fill="#FFFDFC" stroke="#C7B9A4" stroke-width="2"/><rect x="55" y="390" width="9" height="96" rx="4" fill="#B38A43"/><text class="boxTitle" x="79" y="429">参数化 operator</text><text class="boxSub" x="79" y="459">类型、守卫、不变量</text></g><g filter="url(#shadow)"><rect x="330" y="