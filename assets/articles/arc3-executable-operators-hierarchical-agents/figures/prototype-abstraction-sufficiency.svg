<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#4E453B" flood-opacity="0.18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#B38A43"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#A63D35"/></marker>
    <style>
      text{font-family:'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',Arial,sans-serif;fill:#25211D}
      .title{font-size:34px;font-weight:700}.sub{font-size:21px;fill:#756B60}
      .boxTitle{font-size:23px;font-weight:700}.boxSub{font-size:17px;fill:#756B60}
      .small{font-size:16px;fill:#756B60}.formula{font-family:'STIX Two Math','Times New Roman',serif;font-size:21px}
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#F5F0E6"/>
  <path d="M0 750 C392.00000000000006 728, 868 778, 1400 750" stroke="#ECE2D1" stroke-width="3" fill="none" opacity=".55"/>
  <text class="title" x="55" y="65">什么细节可以被上层忘掉？</text><text class="sub" x="55" y="101">只有当所有允许的宏操作都看不出关键后果差异时，两个底层状态才可共享同一抽象。</text><g filter="url(#shadow)"><rect x="70" y="180" width="350" height="160" rx="16" fill="#FFFDFC" stroke="#C7B9A4" stroke-width="2"/><rect x="70" y="180" width="9" height="160" rx="4" fill="#456376"/><text class="boxTitle" x="94" y="219">底层状态 s1</text><text class="boxSub" x="94" y="249">红块右侧有浅色纹理；局部细节 A</text></g><g filter="url(#shadow)"><rect x="70" y="470" width="350" height="160" rx="16" fill="#FFFDFC" stroke="#C7B9A4" stroke-width="2"/><rect x="70" y="470" width="9" height="160" rx="4" fill="#526E5B"/><text class="boxTitle" x="94" y="509">底层状态 s2</text><text class="boxSub" x="94" y="539">红块右侧纹理不同；局部细节 B</text></g><g filter="url(#shadow)"><rect x="545" y="315" width="310" height="170" rx="16" fill="#FFFDFC" stroke="#C7B9A4" stroke-width="2"/><rect x="545" y="315" width="9" height="170" rx="4" fill="#B38A43"/><text class="boxTitle" x="569" y="354">抽象状态 z = φ(s)</text><text class="boxSub" x="569" y="384">保留：对象、位置、可达关系；丢弃：无关纹理</text></g><g filter="url(#shadow)"><rect x="990" y="170" width="340" height="180" rx="16" fill="#FFFDFC" stroke="#C7B9A4" stroke-width="2"/><rect x="990" y="170" width="9" height="180" rx="4" fill="#A63D35"/><text class="boxTitle" x="1014" y="209">调用 option o</text><text class="boxSub" x="1014" y="239">比较累计折扣奖励 R_o 与终止核 M_o</text></g><g filter="url(#shadow)"><rect x="990" y="500" width="340" height="180" rx="16" fill="#FFFDFC" stroke="#C7B9A4" stroke-width="2"/><rect x="990" y="500" width="9" height="180" rx="4" fill="#526E5B"/><text class="boxTitle" x="1014" y="539">上层后果近似一致</text><text class="boxSub" x="1014" y="569">|Delta R_o| &lt;= eps_R 且 ||Delta M_o||_1 &lt;= eps_P</text></g><path d="M420 260 C500 260,500 350,545 365" stroke="#B38A43" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M420 550 C500 550,500 460,545 435" stroke="#B38A43" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M855 400 C930 400,930 260,990 260" stroke="#B38A43" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M1160 350 L1160 500" stroke="#A63D35" stroke-width="4" marker-end="url(#arrowRed)"/><text class="formula" x="55" y="760">M_o(z'|s) = E[ gamma^tau * 1{phi(s_(t+tau))=z'} | s,o ]</text><text class="small" x="760" y="758">持续时间 tau 也属于语义；“同样到达”不等于“同样后果”。</text>
  </svg>