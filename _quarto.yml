project:
  type: website
  render:
    - index.qmd
    - "posts/*.md"
  resources:
    - 404.html
    - assets/legacy-blog-redirect.js
  pre-render:
    - "node scripts/check-content.mjs"
  post-render:
    - "node scripts/export-manifest.mjs"

website:
  title: "李德驰的研究笔记"
  description: "数学、人工智能、Agent、强化学习与认知科学"
  site-url: "https://lidechi.github.io"
  # 不公开源码仓库：不设 repo-url / repo-actions，避免「查看代码」与 GitHub 入口
  favicon: "assets/favicon.svg"
  search: true
  draft-mode: gone
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: "文章"
    right:
      - icon: house
        aria-label: "主页 wordm.us"
        href: "https://wordm.us/"
      - icon: twitter-x
        aria-label: "X"
        href: "https://x.com/parsonjian"
      - icon: newspaper
        aria-label: "Substack"
        href: "https://substack.com/@parson1"
      - icon: telegram
        aria-label: "Telegram"
        href: "https://t.me/fount_ai"
      - icon: discord
        aria-label: "Discord"
        href: "https://discord.gg/2p7fJpXequ"
      - icon: reddit
        aria-label: "Reddit"
        href: "https://www.reddit.com/r/Fount/"
      - icon: rss
        aria-label: "RSS"
        href: index.xml

bibliography: references.bib

lang: zh

format:
  html:
    theme:
      - cosmo
      - styles.scss
    css:
      - assets/site-bg.css
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"
    include-in-header:
      - assets/mathjax-config.html
    toc: true
    number-sections: true
    code-fold: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
